# Disposable local development and test project. Hosted settings are documented in AUTH.md.
project_id = "reviseit-landing"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = false
[realtime]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3101"
additional_redirect_urls = ["http://127.0.0.1:3101/auth/confirm", "http://localhost:3000/auth/confirm"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
enable_refresh_token_rotation = true
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"
[auth.rate_limit]
# Local synthetic tests only; choose launch limits in the hosted project.
email_sent = 100
sign_in_sign_ups = 100
token_verifications = 100
[auth.email.template.confirmation]
subject = "Confirm your Revise It school email"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Reset your Revise It password"
content_path = "./supabase/templates/recovery.html"
